<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Banner de Cristian, desarrollador web junior">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4dd8"/>
    </linearGradient>
    <linearGradient id="neonLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4dd8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2b3a6b" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4dd8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff4dd8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- luces ambientales -->
    <ellipse cx="200" cy="80" rx="320" ry="200" fill="url(#orbA)">
      <animate attributeName="cx" values="200;420;200" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1000" cy="260" rx="320" ry="200" fill="url(#orbB)">
      <animate attributeName="cx" values="1000;780;1000" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- partículas -->
    <g fill="#00e5ff">
      <circle cx="90" cy="290" r="2"><animate attributeName="cy" values="300;20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="300" r="1.5"><animate attributeName="cy" values="310;30" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="305" r="2"><animate attributeName="cy" values="310;10" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="300" r="1.5" fill="#ff4dd8"><animate attributeName="cy" values="310;20" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="300" r="2" fill="#7c4dff"><animate attributeName="cy" values="310;20" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- texto principal -->
    <text x="62" y="86" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#00e5ff">
      &gt; iniciando portafolio<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
    </text>
    <text x="58" y="160" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="4" fill="url(#neon)" filter="url(#glow)">CRISTIAN</text>
    <text x="62" y="200" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" fill="#dbe6ff">Desarrollador Web Junior  ·  SENA ADSO</text>

    <!-- chips de tecnologías -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#cfe8ff" text-anchor="middle">
      <rect x="60" y="226" width="64" height="34" rx="17" fill="#0a1226" fill-opacity="0.8" stroke="url(#neon)" stroke-width="1.5"/><text x="92" y="248">HTML</text>
      <rect x="134" y="226" width="104" height="34" rx="17" fill="#0a1226" fill-opacity="0.8" stroke="url(#neon)" stroke-width="1.5"/><text x="186" y="248">Bootstrap</text>
      <rect x="248" y="226" width="112" height="34" rx="17" fill="#0a1226" fill-opacity="0.8" stroke="url(#neon)" stroke-width="1.5"/><text x="304" y="248">JavaScript</text>
      <rect x="370" y="226" width="92" height="34" rx="17" fill="#0a1226" fill-opacity="0.8" stroke="url(#neon)" stroke-width="1.5"/><text x="416" y="248">Node.js</text>
      <rect x="472" y="226" width="90" height="34" rx="17" fill="#0a1226" fill-opacity="0.8" stroke="url(#neon)" stroke-width="1.5"/><text x="517" y="248">Python</text>
      <rect x="572" y="226" width="62" height="34" rx="17" fill="#0a1226" fill-opacity="0.8" stroke="url(#neon)" stroke-width="1.5"/><text x="603" y="248">SQL</text>
      <rect x="644" y="226" width="100" height="34" rx="17" fill="#0a1226" fill-opacity="0.8" stroke="url(#neon)" stroke-width="1.5"/><text x="694" y="248">MongoDB</text>
    </g>

    <!-- ventana de código -->
    <g>
      <rect x="790" y="46" width="360" height="226" rx="14" fill="#0a1020" fill-opacity="0.88" stroke="url(#neon)" stroke-width="1.5" filter="url(#glow)"/>
      <rect x="790" y="46" width="360" height="32" rx="14" fill="#141d3a"/>
      <rect x="790" y="64" width="360" height="14" fill="#141d3a"/>
      <circle cx="812" cy="62" r="5.5" fill="#ff5f56"/>
      <circle cx="832" cy="62" r="5.5" fill="#ffbd2e"/>
      <circle cx="852" cy="62" r="5.5" fill="#27c93f"/>
      <text x="1130" y="66" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#6d7fb5">perfil.js</text>

      <g font-family="Consolas, 'Courier New', monospace" font-size="17">
        <text x="812" y="118" fill="#cfd8ff"><tspan fill="#c792ff">const</tspan> <tspan fill="#6ec7ff">dev</tspan> = {
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.13;0.92;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="832" y="148" fill="#cfd8ff"><tspan fill="#6ec7ff">nombre</tspan>: <tspan fill="#7dffb2">"Cristian"</tspan>,
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.23;0.92;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="832" y="178" fill="#cfd8ff"><tspan fill="#6ec7ff">stack</tspan>: [<tspan fill="#7dffb2">"JS"</tspan>, <tspan fill="#7dffb2">"Node"</tspan>, <tspan fill="#7dffb2">"Py"</tspan>],
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.33;0.92;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="832" y="208" fill="#cfd8ff"><tspan fill="#6ec7ff">bd</tspan>: [<tspan fill="#7dffb2">"SQL"</tspan>, <tspan fill="#7dffb2">"NoSQL"</tspan>],
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.43;0.92;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="832" y="238" fill="#cfd8ff"><tspan fill="#6ec7ff">listo</tspan>: <tspan fill="#c792ff">true</tspan> <tspan fill="#27c93f">&#10004;</tspan>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.53;0.92;1" dur="10s" repeatCount="indefinite"/></text>
        <text x="812" y="262" fill="#cfd8ff">};
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.63;0.92;1" dur="10s" repeatCount="indefinite"/></text>
      </g>
    </g>

    <!-- línea de escaneo -->
    <rect x="0" y="-10" width="1200" height="3" fill="url(#neonLine)" opacity="0.28">
      <animate attributeName="y" values="-10;330" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- borde inferior animado -->
    <line x1="0" y1="316" x2="1200" y2="316" stroke="url(#neonLine)" stroke-width="5" stroke-dasharray="140 40">
      <animate attributeName="stroke-dashoffset" values="0;-180" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
