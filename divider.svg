<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="Separador">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="0.8" stop-color="#ff4dd8"/>
      <stop offset="1" stop-color="#ff4dd8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#g)" stroke-width="2" opacity="0.55"/>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-dasharray="140 1060" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="140;-1060" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(600 12)">
    <rect x="-7" y="-7" width="14" height="14" fill="#0a1226" stroke="#7c4dff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle r="2.5" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
